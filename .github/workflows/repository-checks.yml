name: Repository Checks

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: '0.5.5'
          install-only: true

      - name: Check commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] &&
            { [[ "$FORCE_PUSH" == "true" ]] ||
              ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
              ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; }; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
          fi

          bash scripts/lint-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"

  lint-files:
    name: Lint Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tracked files
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: '0.5.5'

  vsg:
    name: VHDL Style (VSG)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check VHDL style
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: '0.5.5'
          extra-args: 'vsg --hook-stage manual --all-files'
