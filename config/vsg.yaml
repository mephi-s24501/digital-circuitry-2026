rule:
  global:
    disable: true
    indent_size: 2
    indent_style: spaces

  group:
    case::keyword:
      case: lower
    case::label:
      case: lower
    case::name:
      disable: true
    blank_line:
      disable: true

  # Generic naming: UPPER_SNAKE_CASE with `_G` suffix
  generic_007:
    disable: false
    case: upper
  generic_600:
    disable: false
    suffixes: ['_G']

  # Constant naming: UPPER_SNAKE_CASE with `_C` suffix
  constant_004:
    disable: false
    case: upper
  constant_600:
    disable: false
    suffixes: ['_C']

  # Port direction suffixes
  # TODO: Active-low naming is not yet standardized.
  port_605:
    disable: false
    suffixes: ['_i', '_ni']
  port_606:
    disable: false
    suffixes: ['_o', '_no']
  port_607:
    disable: false
    suffixes: ['_io', '_nio']

  # Maximum line length
  length_001:
    disable: false
    length: 120
