rule:
  global:
    disable: true
    indent_size: 2
    indent_style: spaces

  group:
    case::keyword:
      disable: false
      case: lower
    case::label:
      disable: false
      case: lower

  # Generic naming
  generic_007:
    disable: false
    case: upper
  generic_600:
    disable: false
    suffixes: ['_G']

  # Constant naming
  constant_004:
    disable: false
    case: upper
  constant_600:
    disable: false
    suffixes: ['_C']

  # Port direction suffixes
  port_605:
    disable: false
    suffixes: ['_i', '_ni']
  port_606:
    disable: false
    suffixes: ['_o', '_no']
  port_607:
    disable: false
    suffixes: ['_io', '_nio']

  # Named associations
  generic_map_008:
    disable: false
  port_map_008:
    disable: false

  # Maximum line length
  length_001:
    disable: false
    length: 120
